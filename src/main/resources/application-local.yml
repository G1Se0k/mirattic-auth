# Local development: `./mvnw spring-boot:run -Dspring-boot.run.profiles=local`
spring:
  mail:
    host: localhost
    port: 1025
  datasource:
    password: ${DB_PASSWORD:mirattic_auth}
  security:
    oauth2:
      authorizationserver:
        # Same clients as prod, dev redirect URIs only (lists replace, not merge). docs/clients.md
        client:
          sync:
            registration:
              client-secret: "{noop}dev-sync-secret"
              redirect-uris: [http://127.0.0.1:8080/auth/callback]
          flow:
            registration:
              client-secret: "{noop}dev-flow-secret"
              redirect-uris: [http://127.0.0.1:3000/auth/callback]

auth:
  signing-key:
    generate-if-missing: true
