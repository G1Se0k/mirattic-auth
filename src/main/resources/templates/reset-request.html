<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('비밀번호 찾기')}"></head>
<body>
<header th:replace="~{fragments :: top}"></header>
<main>
  <div class="panel">
    <h1>비밀번호 찾기</h1>

    <th:block th:if="${sent}">
      <p class="lede">가입된 이메일이라면 비밀번호 재설정 링크를 보냈습니다. 링크는 30분 동안 한 번만 쓸 수 있습니다.</p>
      <p class="note ok">메일이 보이지 않으면 스팸함을 확인해주세요. 재설정 메일은 계정당 하루에 한 번만 보냅니다.</p>
    </th:block>

    <th:block th:unless="${sent}">
      <p class="lede">가입할 때 사용한 이메일을 입력하면 새 비밀번호를 정할 수 있는 링크를 보내드립니다.</p>
      <form method="post" th:action="@{/password/reset}">
        <div class="field">
          <label for="email">이메일</label>
          <input id="email" name="email" type="email" autocomplete="email" required autofocus>
        </div>
        <button type="submit" class="primary">재설정 링크 받기</button>
      </form>
    </th:block>

    <p class="alt"><a th:href="@{/login}">로그인으로 돌아가기</a></p>
  </div>
</main>
<footer th:replace="~{fragments :: bottom}"></footer>
</body>
</html>
