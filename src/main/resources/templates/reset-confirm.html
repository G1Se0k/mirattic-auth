<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('새 비밀번호')}"></head>
<body>
<main class="landing">
  <div th:replace="~{fragments :: lockup}"></div>
  <div class="panel">
    <h1>새 비밀번호 설정</h1>
    <p class="lede">변경하면 모든 기기와 앱에서 로그아웃됩니다.</p>

    <p class="note error" th:if="${error}" th:text="${error}"></p>

    <form method="post" th:action="@{/password/reset/confirm}">
      <input type="hidden" name="token" th:value="${token}">
      <div class="field">
        <label for="password">새 비밀번호 <small>8자 이상</small></label>
        <div class="input">
          <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required autofocus>
          <button type="button" class="peek" aria-controls="password" aria-pressed="false">표시</button>
        </div>
      </div>
      <button type="submit" class="primary">비밀번호 변경</button>
    </form>

    <p class="alt"><a th:href="@{/password/reset}">링크를 다시 받아야 하나요?</a></p>
  </div>
</main>
<footer th:replace="~{fragments :: bottom}"></footer>
<script th:replace="~{fragments :: peek}"></script>
</body>
</html>
