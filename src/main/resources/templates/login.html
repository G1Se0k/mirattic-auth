<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('로그인')}"></head>
<body>
<header th:replace="~{fragments :: top}"></header>
<main>
  <div class="panel">
    <h1>로그인</h1>
    <p class="lede" th:if="${clientName}">로그인하면 <strong th:text="${clientName}">Mirattic Sync</strong>로 돌아갑니다.</p>
    <p class="lede" th:unless="${clientName}">Mirattic 계정 하나로 Sync와 Flow를 모두 이용합니다.</p>

    <p class="note error" th:if="${param.error}">이메일 또는 비밀번호가 맞지 않습니다.</p>
    <p class="note ok" th:if="${param.signup}">가입이 완료되었습니다. 로그인해주세요.</p>
    <p class="note ok" th:if="${param.reset}">비밀번호를 변경했습니다. 새 비밀번호로 로그인해주세요.</p>
    <p class="note ok" th:if="${param.logout}">로그아웃되었습니다.</p>

    <form method="post" th:action="@{/login}">
      <div class="field">
        <label for="username">이메일</label>
        <input id="username" name="username" type="email" autocomplete="username" required autofocus>
      </div>
      <div class="field">
        <label for="password">비밀번호 <a th:href="@{/password/reset}">비밀번호를 잊으셨나요?</a></label>
        <div class="input">
          <input id="password" name="password" type="password" autocomplete="current-password" required>
          <button type="button" class="peek" aria-controls="password" aria-pressed="false">표시</button>
        </div>
      </div>
      <button type="submit" class="primary">로그인</button>
    </form>

    <p class="alt">계정이 없으신가요? <a th:href="@{/signup}">회원가입</a></p>
  </div>
</main>
<footer th:replace="~{fragments :: bottom}"></footer>
<script th:replace="~{fragments :: peek}"></script>
</body>
</html>
