<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('로그인')}"></head>
<body>
<main class="landing">
  <div th:replace="~{fragments :: lockup}"></div>
  <div class="panel">
    <h1 class="sr-only">로그인</h1>
    <p class="lede context" th:if="${clientName}">로그인하면 <strong th:text="${clientName}">Mirattic Sync</strong>로 돌아갑니다.</p>

    <p class="note ok" th:if="${param.deleted}">탈퇴했습니다. 그동안 이용해주셔서 감사합니다.</p>
    <p class="note ok" th:if="${param.unlinked}">연결을 해제했습니다. 남은 로그인 방법으로 다시 로그인해주세요.</p>
    <p class="note ok" th:if="${param.reauth}">보안을 위해 한 번 더 로그인해주세요.</p>
    <p class="note error" th:if="${param.error}">이메일 또는 비밀번호가 맞지 않습니다.</p>
    <p class="note error" th:if="${param.social_error}">카카오·네이버·Google 로그인을 마치지 못했습니다. 다시 시도해주세요.</p>
    <p class="note ok" th:if="${param.signup}">가입이 완료되었습니다. 로그인해주세요.</p>
    <p class="note ok" th:if="${param.reset}">비밀번호를 변경했습니다. 새 비밀번호로 로그인해주세요.</p>
    <p class="note ok" th:if="${param.logout}">로그아웃되었습니다.</p>

    <div th:replace="~{fragments :: social}"></div>
    <p class="divider" th:if="${emailLogin}"><span>또는 이메일로</span></p>

    <form method="post" th:action="@{/login}" th:if="${emailLogin}">
      <div class="field">
        <label for="username">이메일</label>
        <input id="username" name="username" type="email" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="password">비밀번호</label>
        <div class="input">
          <input id="password" name="password" type="password" autocomplete="current-password" required>
          <button type="button" class="peek" aria-controls="password" aria-pressed="false">표시</button>
        </div>
        <!-- After the field, not in its label: Tab from the email goes to the password first. -->
        <p class="forgot"><a th:href="@{/password/reset}">비밀번호를 잊으셨나요?</a></p>
      </div>
      <button type="submit" class="primary">로그인</button>
    </form>

    <p class="alt" th:if="${emailLogin}">계정이 없으신가요? <a th:href="@{/signup}">회원가입</a></p>
  </div>
</main>
<footer th:replace="~{fragments :: bottom}"></footer>
<script th:replace="~{fragments :: peek}"></script>
</body>
</html>
