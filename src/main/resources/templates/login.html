<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Mirattic 로그인</title><link rel="stylesheet" th:href="@{/style.css}"></head>
<body><main>
  <h1>Mirattic 로그인</h1>
  <div class="msg error" th:if="${param.error}">이메일 또는 비밀번호가 올바르지 않습니다.</div>
  <div class="msg ok" th:if="${param.signup}">가입이 완료되었습니다. 로그인하세요.</div>
  <div class="msg ok" th:if="${param.reset}">비밀번호가 변경되었습니다. 로그인하세요.</div>
  <div class="msg ok" th:if="${param.logout}">로그아웃되었습니다.</div>
  <form method="post" th:action="@{/login}">
    <label for="username">이메일</label>
    <input id="username" name="username" type="email" autocomplete="username" required autofocus>
    <label for="password">비밀번호</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button type="submit">로그인</button>
  </form>
  <div class="links"><a th:href="@{/signup}">회원가입</a><a th:href="@{/password/reset}">비밀번호 찾기</a></div>
</main></body>
</html>
