<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Mirattic 회원가입</title><link rel="stylesheet" th:href="@{/style.css}"></head>
<body><main>
  <h1>Mirattic 계정 만들기</h1>
  <div class="msg error" th:if="${error}" th:text="${error}"></div>
  <form method="post" th:action="@{/signup}">
    <label for="email">이메일</label>
    <input id="email" name="email" type="email" autocomplete="email" maxlength="254" required th:value="${email}">
    <label for="displayName">이름</label>
    <input id="displayName" name="displayName" autocomplete="nickname" maxlength="64" required th:value="${displayName}">
    <label for="password">비밀번호 (8자 이상)</label>
    <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required>
    <button type="submit">가입하기</button>
  </form>
  <div class="links"><a th:href="@{/login}">이미 계정이 있습니다</a></div>
</main></body>
</html>
