<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('내 계정')}"></head>
<body>
<header class="top">
  <a class="brand" th:href="@{/account}"><img th:src="@{/mark.svg}" alt="">Mirattic <span>계정</span></a>
  <form method="post" th:action="@{/logout}"><button type="submit" class="text-button">로그아웃</button></form>
</header>
<main>
  <div class="panel">
    <h1 class="spaced" th:text="${account.displayName} + ' 님'">홍길동 님</h1>

    <p class="note error" th:if="${error}" th:text="${error}"></p>
    <p class="note ok" th:if="${param.saved}">이름을 저장했습니다.</p>
    <p class="note ok" th:if="${param.password}">비밀번호를 변경했습니다. 다른 기기와 앱에서는 다시 로그인해야 합니다.</p>

    <dl class="facts">
      <div><dt>이메일</dt><dd th:text="${account.email}">you@example.com</dd></div>
      <div><dt>계정 ID</dt><dd><code th:text="${account.id}">uuid</code></dd></div>
    </dl>

    <section>
      <h2>이름</h2>
      <form method="post" th:action="@{/account/name}" class="row">
        <input name="displayName" maxlength="64" required th:value="${account.displayName}" aria-label="이름">
        <button type="submit" class="primary">저장</button>
      </form>
    </section>

    <section>
      <h2>비밀번호 변경</h2>
      <form method="post" th:action="@{/account/password}">
        <div class="field">
          <label for="currentPassword">현재 비밀번호</label>
          <div class="input">
            <input id="currentPassword" name="currentPassword" type="password" autocomplete="current-password" required>
            <button type="button" class="peek" aria-controls="currentPassword" aria-pressed="false">표시</button>
          </div>
        </div>
        <div class="field">
          <label for="password">새 비밀번호 <small>8자 이상</small></label>
          <div class="input">
            <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required>
            <button type="button" class="peek" aria-controls="password" aria-pressed="false">표시</button>
          </div>
        </div>
        <button type="submit" class="primary">비밀번호 변경</button>
      </form>
    </section>
  </div>
</main>
<footer th:replace="~{fragments :: bottom}"></footer>
<script th:replace="~{fragments :: peek}"></script>
</body>
</html>
