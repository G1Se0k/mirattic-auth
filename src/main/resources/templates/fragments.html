<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<!-- Shared pieces of every Auth page. -->
<head th:fragment="head(title)">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title th:text="${title} + ' · Mirattic'">Mirattic</title>
  <link rel="icon" type="image/svg+xml" th:href="@{/mark.svg}">
  <link rel="icon" type="image/png" sizes="32x32" th:href="@{/favicon-32.png}">
  <link rel="apple-touch-icon" th:href="@{/apple-touch-icon.png}">
  <link rel="preload" th:href="@{/fonts/PretendardStdVariable.woff2}" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>
<header class="top" th:fragment="top">
  <a class="brand" th:href="@{/account}"><img th:src="@{/mark.svg}" alt="">Mirattic <span>계정</span></a>
</header>

<header class="top" th:fragment="admin-top">
  <a class="brand" th:href="@{/admin}"><img th:src="@{/mark.svg}" alt="">Mirattic <span>관리자</span></a>
  <a th:href="@{/account}">내 계정</a>
</header>

<!-- A product's admin report (ProductAdmin.Report): facts, then tables. -->
<div th:fragment="report(p)">
  <p class="note error" th:if="${p.error}" th:text="${p.error}"></p>
  <dl class="facts" th:unless="${p.facts.isEmpty()}">
    <div th:each="f : ${p.facts}"><dt th:text="${f[0]}">항목</dt><dd th:text="${f.size() > 1 ? f[1] : ''}">값</dd></div>
  </dl>
  <th:block th:each="t : ${p.tables}">
    <h3 th:text="${t.title}">표</h3>
    <div class="scroll">
      <table class="list">
        <thead><tr><th th:each="c : ${t.columns}" th:text="${c}">열</th></tr></thead>
        <tbody>
          <tr th:each="r : ${t.rows}"><td th:each="v : ${r}" th:text="${v}">값</td></tr>
          <tr th:if="${t.rows.isEmpty()}"><td th:colspan="${t.columns.size()}" class="muted">없음</td></tr>
        </tbody>
      </table>
    </div>
  </th:block>
</div>

<footer th:fragment="bottom">© Mirattic · <a th:href="@{/privacy}">개인정보처리방침</a></footer>

<!-- Logo lockup: mark + "Mirattic" wordmark (dot of the last i in the brand blue, as in the Flow logo). -->
<div class="lockup" th:fragment="lockup" role="img" aria-label="Mirattic">
  <img th:src="@{/mark.svg}" alt="" width="128" height="128">
  <span class="wordmark" aria-hidden="true">Miratt<span class="i">ı<span class="dot"></span></span>c</span>
</div>

<!-- "표시" toggle for password inputs: <div class="input"><input type="password" ...><button class="peek" ...> -->
<!-- Kakao / Naver / Google sign-in, per their button guidelines (Kakao #FEE500 + black symbol, Naver #03C75A + white N,
     Google: standard four-colour G, light #FFFFFF / #747775 / #1F1F1F, dark #131314 / #8E918F / #E3E3E3). -->
<div class="social" th:fragment="social">
  <a class="social-button kakao" th:href="@{/oauth2/authorization/kakao}">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3C6.48 3 2 6.5 2 10.82c0 2.8 1.87 5.26 4.68 6.64l-.95 3.5c-.08.3.26.54.52.37l4.13-2.74c.53.06 1.07.1 1.62.1 5.52 0 10-3.5 10-7.87S17.52 3 12 3z"/></svg>
    카카오로 계속하기
  </a>
  <a class="social-button naver" th:href="@{/oauth2/authorization/naver}">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16.27 12.84 7.46 0H0v24h7.73V11.16L16.54 24H24V0h-7.73z"/></svg>
    네이버로 계속하기
  </a>
  <a class="social-button google" th:href="@{/oauth2/authorization/google}">
    <svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
    Google로 계속하기
  </a>
</div>

<script th:fragment="peek">
  document.querySelectorAll('.peek').forEach(function (b) {
    var input = b.previousElementSibling;
    input.setAttribute('data-peek', '');
    b.addEventListener('click', function () {
      var show = input.type === 'password';
      input.type = show ? 'text' : 'password';
      b.textContent = show ? '숨기기' : '표시';
      b.setAttribute('aria-pressed', String(show));
      input.focus();
    });
  });
</script>
</body>
</html>
