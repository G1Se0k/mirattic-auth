spring:
  application:
    name: mirattic-auth
  datasource:
    # preserveInstants/UTC: required by Spring Authorization Server's JDBC schema on MySQL.
    url: ${DB_URL:jdbc:mysql://localhost:3307/mirattic_auth?preserveInstants=true&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
    username: ${DB_USERNAME:mirattic_auth}
    password: ${DB_PASSWORD:}
  security:
    oauth2:
      # Kakao / Naver sign-in (docs/oauth-oidc.md "Social login"), the apps the old Flow login used.
      # Their consoles must list https://auth.mirattic.com/login/oauth2/code/{kakao|naver} as redirect URI.
      client:
        registration:
          kakao:
            client-name: 카카오
            client-id: ${KAKAO_CLIENT_ID:dev-kakao}
            client-secret: ${KAKAO_CLIENT_SECRET:}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
          naver:
            client-name: 네이버
            client-id: ${NAVER_CLIENT_ID:dev-naver}
            client-secret: ${NAVER_CLIENT_SECRET:}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response
      authorizationserver:
        issuer: ${AUTH_ISSUER:http://localhost:9000}
        # Registered clients: docs/clients.md. Dev redirect URIs live in application-local.yml.
        client:
          sync:
            registration:
              client-id: mirattic-sync
              client-name: Mirattic Sync
              # BCrypt hash only ({bcrypt}$2...). The raw secret lives in the product backend. No default.
              client-secret: ${SYNC_CLIENT_SECRET_HASH}
              client-authentication-methods: [client_secret_basic]
              authorization-grant-types: [authorization_code, refresh_token]
              redirect-uris: [https://sync.mirattic.com/auth/callback]
              scopes: [openid, profile, email]
            require-proof-key: true
            token:
              access-token-time-to-live: 15m
              refresh-token-time-to-live: 30d
              # Rotation: every refresh returns a new refresh token; the old one stops working.
              reuse-refresh-tokens: false
          flow:
            registration:
              client-id: mirattic-flow
              client-name: Mirattic Flow
              # BCrypt hash only ({bcrypt}$2...). The raw secret lives in the product backend. No default.
              client-secret: ${FLOW_CLIENT_SECRET_HASH}
              client-authentication-methods: [client_secret_basic]
              authorization-grant-types: [authorization_code, refresh_token]
              redirect-uris: [https://flow.mirattic.com/auth/callback]
              # OIDC RP-initiated logout (/connect/logout): where Auth sends the browser after ending its session.
              post-logout-redirect-uris: ["https://flow.mirattic.com/login?logout=success"]
              scopes: [openid, profile, email]
            require-proof-key: true
            token:
              access-token-time-to-live: 15m
              refresh-token-time-to-live: 30d
              # Rotation: every refresh returns a new refresh token; the old one stops working.
              reuse-refresh-tokens: false
  session:
    jdbc:
      initialize-schema: never # Flyway V3
  autoconfigure:
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

server:
  port: ${PORT:9000}
  forward-headers-strategy: native
  servlet:
    session:
      cookie:
        # Top-level GET navigations from sync/flow to /oauth2/authorize still carry it (SSO).
        same-site: lax
        http-only: true

auth:
  # HMAC key for the signup-per-network hashes (signup_ips). Kept across restarts; random when unset (local, tests).
  signup-ip-key: ${SIGNUP_IP_KEY:}
  # POST /login, /signup, /password/reset[/confirm], /account/password per client IP
  rate-limit-per-minute: 20
  mail:
    from: ${AUTH_MAIL_FROM:noreply@mirattic.com}
  # Where Auth orders a product to delete a Mirattic account's data (AccountDeletion, Auth-signed JWT).
  account-deletion:
    flow-url: ${FLOW_ACCOUNT_DELETION_URL:https://flow.mirattic.com/api/internal/account-deletion}
    sync-url: ${SYNC_ACCOUNT_DELETION_URL:https://sync.mirattic.com/api/internal/account-deletion}
  signing-key:
    path: ${AUTH_SIGNING_KEY_PATH:./.local/signing-key.jwk.json}
    # During a rotation: the key that was current before, published (public part) but no longer used to sign.
    previous-path: ${AUTH_SIGNING_KEY_PREVIOUS_PATH:}
    # true only with a persistent key location (local profile, prod volume); see docs/deployment.md
    generate-if-missing: ${AUTH_SIGNING_KEY_GENERATE:false}

management:
  # SMTP trouble must not mark Auth itself DOWN; mail failures are logged instead.
  health:
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health
